version: "3.9"

# ── MARC on Stellar — Development Environment ──────────────────────────────
#
# Prerequisites:
#   Docker 24+ with Compose v2
#
# Quick start:
#   cp .env.example .env              # fill in secrets
#   docker compose up                  # starts soroban-rpc + all agents
#   docker compose up buyer            # interactive TUI only
#
# Services:
#   soroban-rpc   local Stellar devnet (Soroban-enabled, port 8000)
#   sdk           build the marc-stellar-sdk TypeScript package
#   dashboard     web dashboard UI (port 3000)
#   registry      agent discovery API (port 4500)
#   seller-*      agent workers (ports 4501-4504)
#   buyer         interactive Blessed TUI (healthcheck port 4550, stdin required)

x-node: &node
  working_dir: /app
  env_file: ${ENV_FILE:-.env}
  networks:
    - marc-net
  user: nonroot

services:
  soroban-rpc:
    image: stellar/quickstart:latest
    command: --local --enable-soroban
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/.well-known/stellar.toml"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - marc-net

  # ── SDK (one-shot build) ──────────────────────────────────────────────────
  sdk:
    <<: *node
    working_dir: /app/sdk
    command: sh -c "npm install --silent 2>/dev/null && npm run build"
    restart: "no"
    profiles: ["setup"]

  # ── Web Dashboard ──────────────────────────────────────────────────────────
  dashboard:
    <<: *node
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
    depends_on:
      sdk:
        condition: service_completed_successfully
      soroban-rpc:
        condition: service_healthy

  # ── Agent Registry ────────────────────────────────────────────────────────
  registry:
    <<: *node
    build:
      context: .
      dockerfile: agents/registry/Dockerfile
    working_dir: /app
    ports:
      - "4500:4500"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4500/health || node -e \"fetch('http://localhost:4500/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      sdk:
        condition: service_completed_successfully

  # ── Seller Agents ─────────────────────────────────────────────────────────
  seller-webbuilder:
    <<: *node
    build:
      context: .
      dockerfile: agents/seller-webbuilder/Dockerfile
    working_dir: /app
    ports:
      - "4501:4501"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4501/health || node -e \"fetch('http://localhost:4501/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

  seller-copywriter:
    <<: *node
    build:
      context: .
      dockerfile: agents/seller-copywriter/Dockerfile
    working_dir: /app
    ports:
      - "4502:4502"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4502/health || node -e \"fetch('http://localhost:4502/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

  seller-namer:
    <<: *node
    build:
      context: .
      dockerfile: agents/seller-namer/Dockerfile
    working_dir: /app
    ports:
      - "4503:4503"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4503/health || node -e \"fetch('http://localhost:4503/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

  seller-researcher:
    <<: *node
    build:
      context: .
      dockerfile: agents/seller-researcher/Dockerfile
    working_dir: /app
    ports:
      - "4504:4504"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4504/health || node -e \"fetch('http://localhost:4504/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

  # ── Soroban Event Indexer ─────────────────────────────────────────────────
  indexer:
    <<: *node
    build:
      context: .
      dockerfile: indexer/Dockerfile
    working_dir: /app
    depends_on:
      sdk:
        condition: service_completed_successfully
      soroban-rpc:
        condition: service_healthy

  # ── Buyer TUI (interactive) ───────────────────────────────────────────────
  buyer:
    <<: *node
    build:
      context: .
      dockerfile: agents/buyer/Dockerfile
    working_dir: /app
    ports:
      - "4550:4550"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4550/health || node -e \"fetch('http://localhost:4550/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stdin_open: true
    tty: true
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_started

networks:
  marc-net:
    driver: bridge
