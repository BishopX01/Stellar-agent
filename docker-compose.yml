version: "3.9"

# ── MARC on Stellar — Development Environment ──────────────────────────────
#
# Prerequisites:
#   Docker 24+ with Compose v2
#
# Quick start:
#   cp .env.example .env              # fill in secrets
#   docker compose up                  # starts soroban-rpc + all agents
#   docker compose up buyer            # interactive TUI only
#
# Services:
#   stellar       local standalone Stellar network + Soroban RPC (port 8000)
#   init          one-shot: waits for RPC, compiles + deploys contracts, funds keys
#   sdk           build the marc-stellar-sdk TypeScript package
#   dashboard     web dashboard UI (port 3000)
#   registry      agent discovery API (port 4500)
#   seller-*      agent workers (ports 4501-4504)
#   buyer         interactive Blessed TUI (healthcheck port 4550, stdin required)
#
# Offline Local Development:
#   Everything runs against the in-container standalone network — no external
#   network access is required. `docker compose up` generates .env.docker with
#   the local RPC URL and deployed contract IDs, then boots the full stack.

x-node: &node
  working_dir: /app
  volumes:
    - .:/app
  env_file:
    - path: ${ENV_FILE:-.env}
      required: false
    - path: .env.docker
      required: false
  networks:
    - marc-net
  user: nonroot

services:
  # ── Local Stellar / Soroban Standalone Network ────────────────────────────
  stellar:
    image: stellar/quickstart:testing
    command: --standalone --enable-soroban-rpc --enable-core-artificially-accelerate-time
    ports:
      - "8000:8000"
    environment:
      NETWORK: standalone
      ENABLE_SOROBAN_RPC: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://localhost:8000/soroban/rpc || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - marc-net

  # ── Init: compile + deploy contracts, fund test keypairs ──────────────────
  init:
    <<: *node
    working_dir: /app
    command: sh -c "
      echo '[init] waiting for local Soroban RPC...' &&
      until curl -sf -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://stellar:8000/soroban/rpc >/dev/null 2>&1; do sleep 2; done &&
      echo '[init] RPC ready' &&
      sh scripts/init-local.sh
    "
    environment:
      SOROBAN_RPC_URL: http://stellar:8000/soroban/rpc
      STELLAR_NETWORK: standalone
      STELLAR_NETWORK_PASSPHRASE: 'Standalone Network ; February 2017'
      ENV_FILE: .env.docker
    restart: "no"
    depends_on:
      stellar:
        condition: service_healthy
    networks:
      - marc-net

  # ── SDK (one-shot build) ──────────────────────────────────────────────────
  sdk:
    <<: *node
    working_dir: /app/sdk
    command: sh -c "npm install --silent 2>/dev/null && npm run build"
    restart: "no"
    profiles: ["setup"]

  # ── Web Dashboard ──────────────────────────────────────────────────────────
  dashboard:
    <<: *node
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
    depends_on:
      sdk:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully

  # ── Agent Registry ────────────────────────────────────────────────────────
  registry:
    <<: *node
    build:
      context: .
      dockerfile: agents/registry/Dockerfile
    working_dir: /app
    ports:
      - "4500:4500"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4500/health || node -e \"fetch('http://localhost:4500/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      sdk:
        condition: service_completed_successfully

  # ── Seller Agents ─────────────────────────────────────────────────────────
  seller-webbuilder:
    <<: *node
    build:
      context: .
      dockerfile: agents/seller-webbuilder/Dockerfile
    working_dir: /app
    ports:
      - "4501:4501"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4501/health || node -e \"fetch('http://localhost:4501/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

  seller-copywriter:
    <<: *node
    build:
      context: .
      dockerfile: agents/seller-copywriter/Dockerfile
    working_dir: /app
    ports:
      - "4502:4502"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4502/health || node -e \"fetch('http://localhost:4502/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

  seller-namer:
    <<: *node
    build:
      context: .
      dockerfile: agents/seller-namer/Dockerfile
    working_dir: /app
    ports:
      - "4503:4503"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4503/health || node -e \"fetch('http://localhost:4503/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

  seller-researcher:
    <<: *node
    build:
      context: .
      dockerfile: agents/seller-researcher/Dockerfile
    working_dir: /app
    ports:
      - "4504:4504"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4504/health || node -e \"fetch('http://localhost:4504/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_healthy

  # ── Soroban Event Indexer ─────────────────────────────────────────────────
  indexer:
    <<: *node
    build:
      context: .
      dockerfile: indexer/Dockerfile
    working_dir: /app
    depends_on:
      sdk:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully

  # ── Buyer TUI (interactive) ───────────────────────────────────────────────
  buyer:
    <<: *node
    build:
      context: .
      dockerfile: agents/buyer/Dockerfile
    working_dir: /app
    ports:
      - "4550:4550"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4550/health || node -e \"fetch('http://localhost:4550/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    stdin_open: true
    tty: true
    depends_on:
      sdk:
        condition: service_completed_successfully
      registry:
        condition: service_started

networks:
  marc-net:
    driver: bridge
