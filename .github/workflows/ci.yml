name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  react-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build React package
        run: npm run build --workspace @marc-stellar/react
      - name: Run React hook tests with coverage
        run: npm test --workspace @marc-stellar/react -- --coverage
      - name: Check bundle size (<15 KB gzipped)
        run: npm run size --workspace @marc-stellar/react

  nextjs-ssr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build React package
        run: npm run build --workspace @marc-stellar/react
      - name: Build Next.js starter (SSR verification)
        working-directory: examples/nextjs-starter
        run: |
          npm ci
          npm run build 2>&1 | tee next-build.log
          if grep -q "window is not defined" next-build.log; then
            echo "SSR error: 'window is not defined' detected during Next.js build" >&2
            exit 1
          fi

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for git conflict markers in TypeScript files
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.ts' '*.tsx'; then
            echo "Git conflict markers found in the files above" >&2
            exit 1
          fi

  state-dump:
    runs-on: ubuntu-latest
    env:
      SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL }}
      CONTRACT_ID: ${{ vars.CONTRACT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Export contract state snapshot
        shell: bash
        run: |
          if [[ -n "$SOROBAN_RPC_URL" && -n "$CONTRACT_ID" ]]; then
            npm run state:dump -- --rpc-url "$SOROBAN_RPC_URL" --contract-id "$CONTRACT_ID" --out state-manifest.json
          else
            echo "RPC secrets unavailable; running state:dump in offline/dry-run mode" >&2
            npm run state:dump -- --offline --out state-manifest.json
          fi
      - name: Upload state manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-manifest
          path: state-manifest.json
          if-no-files-found: warn

  wasm-size:
    runs-on: ubuntu-latest
    env:
      IDENTITY_WASM_BUDGET_BYTES: ${{ vars.IDENTITY_WASM_BUDGET_BYTES || '8192' }}
      COMMERCE_WASM_BUDGET_BYTES: ${{ vars.COMMERCE_WASM_BUDGET_BYTES || '16384' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - name: Build release WASM
        run: cargo build --target wasm32v1-none --workspace --release
      - name: Install Stellar CLI optimizer
        run: cargo install stellar-cli --locked --version 25.2.0
      - name: Optimize Soroban contracts
        run: stellar contract build --optimize
      - name: Check WASM binary sizes
        shell: bash
        run: |
          identity="target/wasm32v1-none/release/agent_identity.wasm"
          commerce="target/wasm32v1-none/release/agentic_commerce.wasm"
          identity_size=$(stat -c%s "$identity")
          commerce_size=$(stat -c%s "$commerce")
          echo "identity=${identity_size}B (budget=${IDENTITY_WASM_BUDGET_BYTES}B)"
          echo "commerce=${commerce_size}B (budget=${COMMERCE_WASM_BUDGET_BYTES}B)"
          if [[ ! "$IDENTITY_WASM_BUDGET_BYTES" =~ ^[0-9]+$ || ! "$COMMERCE_WASM_BUDGET_BYTES" =~ ^[0-9]+$ ]]; then
            echo "WASM size budgets must be non-negative integers" >&2
            exit 1
          fi
          if (( identity_size > IDENTITY_WASM_BUDGET_BYTES )); then
            echo "identity WASM exceeds its configured size budget" >&2
            exit 1
          fi
          if (( commerce_size > COMMERCE_WASM_BUDGET_BYTES )); then
            echo "commerce WASM exceeds its configured size budget" >&2
            exit 1
          fi

  gas-profile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gas-profile-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gas-profile-${{ runner.os }}-
      - name: Profile contract gas usage
        run: bash scripts/profile-gas.sh > gas-report.json
      - name: Compare against baseline
        id: compare
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('.gas-baseline.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('gas-report.json', 'utf8'));
          const metrics = ['cpu_instructions', 'memory_bytes'];
          const rows = [];
          let failed = false;
          for (const [entry, base] of Object.entries(baseline)) {
            const cur = current[entry] || {};
            for (const metric of metrics) {
              const b = base[metric] ?? 0;
              const c = cur[metric] ?? 0;
              const delta = b === 0 ? 0 : ((c - b) / b) * 100;
              const regressed = delta > 10;
              if (regressed) failed = true;
              rows.push(`| ${entry} | ${metric} | ${b} | ${c} | ${delta.toFixed(2)}% | ${regressed ? '❌' : '✅'} |`);
            }
          }
          const body = [
            '## Gas Profiling Report',
            '',
            '| Entry point | Metric | Baseline | Current | Delta | Status |',
            '| --- | --- | --- | --- | --- | --- |',
            ...rows,
            '',
            failed ? '❌ Gas regression greater than 10% detected.' : '✅ No gas regressions detected.',
          ].join('\n');
          fs.writeFileSync('gas-comment.md', body);
          fs.writeFileSync('gas-failed', failed ? 'true' : 'false');
          EOF
      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('gas-comment.md')) return;
            const body = fs.readFileSync('gas-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail on regression
        run: |
          if [ "$(cat gas-failed 2>/dev/null)" = "true" ]; then
            echo "Gas regression exceeds 10% threshold" >&2
            exit 1
          fi

  gas-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compare contract gas usage against .gas-baseline.json
        run: npm run gas:check

  fuzz-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run 10-minute fuzzing smoke check
        run: |
          cd contracts/fuzz
          for target in $(cargo fuzz list); do
            timeout 600 cargo fuzz run "$target" -- -max_total_time=600 -rss_limit_mb=4096 || exit 1
          done
